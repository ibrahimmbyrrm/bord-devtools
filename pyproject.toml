[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bord-devtools"
version = "0.1.0"
description = "Optional live engineering pipeline workbench for BORD"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.100"]

[tool.setuptools.package-data]
bord_devtools = ["*.html", "*.css", "*.js"]
